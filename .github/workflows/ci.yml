name: CI

# Every third-party action is pinned to a full commit SHA, with the release it
# corresponds to in a trailing comment that Dependabot keeps current. A tag or
# a branch can be moved to point at different code; a commit cannot.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Scoped to the library: `demo/` pulls in vta-sdk's whole dependency tree
      # (trust-tasks-rs, dtg-credentials, reqwest/rustls, ...), which would make every
      # PR pay for compiling it. See the `test` job below.
      - run: cargo clippy -p predicate-credential-system --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Scoped to the library, not `--workspace`: `demo/` depends on vta-sdk, which drags
      # in trust-tasks-rs, dtg-credentials, affinidi-data-integrity, reqwest/rustls and the
      # rest of that stack, turning every PR's CI into a full Affinidi-ecosystem build for a
      # crate nothing here publishes or ships. Run `cargo test -p pcs-vetting-prototype`
      # locally (see demo/README.md) before changing `demo/`.
      - run: cargo test -p predicate-credential-system --all-features --all-targets

  # `default = []`, so this is the only job that ever builds the library with
  # no features at all; the dev-dependency on itself (test-utils + serde)
  # means the test targets always pull those in regardless of this flag. Scoped to the library:
  # `demo/` has no features of its own.
  no-default-features:
    name: No default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p predicate-credential-system --no-default-features

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --no-deps -p predicate-credential-system --features serde

  # The published crate's MSRV commitment; `demo/` (never published) is not held to it.
  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - run: cargo check -p predicate-credential-system --all-features

  # A crate that cannot be packaged cannot be released, and finding that out at tag time means
  # the tag is already wrong. `demo/` is `publish = false` and excluded.
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo package -p predicate-credential-system --locked
