<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Hidden vetting, step by step</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316191f'/%3E%3Ccircle cx='9' cy='9' r='2.6' fill='%237ea2f7'/%3E%3Ccircle cx='9' cy='16' r='2.6' fill='%237ea2f7'/%3E%3Ccircle cx='9' cy='23' r='2.6' fill='none' stroke='%237ea2f7' stroke-width='1.4'/%3E%3Cpath d='M11.4 9.8 21 15M11.6 16H21' stroke='%23e7e9ed' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='23.5' cy='16' r='3.2' fill='%23e7e9ed'/%3E%3C/svg%3E">
<link rel="preload" href="/static/katex/fonts/KaTeX_Main-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/katex/fonts/KaTeX_SansSerif-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/katex/fonts/KaTeX_Math-Italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/katex/katex.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to the step</a>
<div class="app" id="app">
  <header class="topbar">
    <button type="button" class="tool icon" id="menu" title="All steps" aria-expanded="false" aria-controls="outline">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      <span class="sr-only">All steps</span>
    </button>
    <a class="brand" href="#/stage/intro" aria-label="Hidden vetting: back to the start">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="mark-bg" width="32" height="32" rx="7"></rect>
        <circle class="mark-v" cx="9" cy="9" r="2.6"></circle>
        <circle class="mark-v" cx="9" cy="16" r="2.6"></circle>
        <circle class="mark-v idle" cx="9" cy="23" r="2.6"></circle>
        <path class="mark-l" d="M11.4 9.8 21 15M11.6 16H21"></path>
        <circle class="mark-a" cx="23.5" cy="16" r="3.2"></circle>
      </svg>
      <span class="brand-text">
        <span class="brand-name">Hidden vetting</span>
        <span class="brand-sub">predicate credentials, step by step</span>
      </span>
    </a>
    <nav class="track" id="track" aria-label="Steps, by phase"></nav>
    <div class="tools">
      <div class="run" id="run-info" aria-live="polite"></div>
      <button type="button" class="tool" id="reseed" title="Recompute every value with a random seed">New randomness</button>
      <button type="button" class="tool icon" id="present" title="Presenter mode (P)" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="1.5"></rect><path d="M12 16.5v3.5M8 20h8"></path></svg>
        <span class="sr-only">Presenter mode</span>
      </button>
      <button type="button" class="tool icon" id="theme" title="Light or dark (T)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"></circle><path class="fill" d="M12 4.5a7.5 7.5 0 0 1 0 15z"></path></svg>
        <span class="sr-only">Switch between light and dark</span>
      </button>
      <button type="button" class="tool icon" id="help-btn" title="How to read this page (?)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.6"></path><circle class="fill" cx="12" cy="16.8" r=".9"></circle></svg>
        <span class="sr-only">How to read this page</span>
      </button>
    </div>
  </header>
  <div class="stepbar" id="stepbar">
    <button type="button" class="nav-btn prev" id="prev">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      <span class="lbl"><small>Previous</small><b id="prev-title"></b></span>
    </button>
    <div class="here">
      <div class="here-top">
        <span class="pos" id="pos"></span>
        <span class="phase" id="phase-pos"></span>
        <label class="pace" title="How the actions of a step are played">Pace
          <select id="pace">
            <option value="auto">auto</option>
            <option value="slow">slow</option>
            <option value="manual">one action per key</option>
            <option value="instant">instant</option>
          </select>
        </label>
      </div>
      <div class="here-bottom">
        <ol class="act-dots" id="act-dots" aria-hidden="true"></ol>
        <span class="status" id="status" aria-live="polite"></span>
      </div>
    </div>
    <button type="button" class="nav-btn next primary" id="next">
      <span class="lbl"><small id="next-small">Next</small><b id="next-title"></b></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </div>
  <nav class="outline" id="outline" aria-label="All steps"></nav>
  <div class="scrim" id="scrim" hidden></div>
  <div class="layout">
    <main class="sheet" id="main" tabindex="-1">
      <p class="loading">Computing the run…</p>
    </main>
    <aside class="rail" id="rail" aria-label="Where things stand"></aside>
  </div>
  <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
</div>

<div class="overlay" id="help" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="dialog-head">
      <h2 id="help-title">How to read this page</h2>
      <button type="button" class="tool icon" id="help-close" title="Close (Esc)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg>
        <span class="sr-only">Close</span>
      </button>
    </div>
    <div class="dialog-body" id="help-body"></div>
  </div>
</div>

<script src="/static/katex/katex.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
