[package]
name = "predicate-credential-system"
version = "0.1.0"
edition = "2024"
# The minimum supported Rust version of OpenVTC, the crate's primary intended consumer.
rust-version = "1.95.0"
license = "MIT"
# Original author of the research implementation this crate is forked from
# (https://github.com/etairi/predicate-credential-system, base commit 5d11dc4).
authors = ["Erkan Tairi"]
description = "Rust implementation of predicate credentials (PCreds): the protocol of the ideal functionality F_PCreds, generic over its building blocks, with pairing-based (sigma-protocol) and lattice-based (Jali) instantiations"
readme = "README.md"
repository = "https://github.com/OpenVTC/predicate-credential-system"
keywords = ["cryptography", "credentials", "zero-knowledge", "sigma-protocols", "pairing"]
categories = ["cryptography"]

# `demo/` is a workspace member so the repository is self-contained and shares one lockfile, but
# it is `publish = false` (see demo/Cargo.toml) — only this root crate goes to crates.io.
[workspace]
members = ["demo"]

# docs.rs (and `cargo docs`, see .cargo/config.toml): document the optional `serde` layer, load
# KaTeX so that the formulas render, and mark feature-gated items (`--cfg docsrs`, nightly only).
[package.metadata.docs.rs]
features = ["serde", "jali", "lattice"]
rustdoc-args = ["--html-in-header", "docs/katex-header.html", "--cfg", "docsrs"]

# arkworks 0.6.0. The crate is std-only, so `std` is switched on directly instead of being
# forwarded through a crate feature.
[dependencies]
ark-ec        = { version = "0.6.0", default-features = false, features = ["std"] }
ark-ff        = { version = "0.6.0", default-features = false, features = ["std"] }
ark-serialize = { version = "0.6.0", default-features = false, features = ["derive", "std"] }
ark-std       = { version = "0.6.0", default-features = false, features = ["std"] }
ark-bls12-381 = { version = "0.6.0", default-features = false, features = ["curve", "std"] }
# MUST stay 0.10: ark-ff's `DefaultFieldHasher` is tied to `digest 0.10`.
sha2          = { version = "0.10", default-features = false, features = ["std"] }
zeroize       = { version = "1", default-features = false, features = ["std", "derive"] }
thiserror     = "2"
# Optional JSON-friendly representations (feature `serde`): multibase base58btc strings, the
# convention of W3C Data Integrity `proofValue`s. See the module `serialization`.
serde         = { version = "1", optional = true, default-features = false, features = ["derive", "std"] }
multibase     = { version = "0.9", optional = true }
# Optional (feature `jali`): Jali, the standalone lattice zero-knowledge library
# (https://crates.io/crates/jali), the proof backend of the lattice instantiation (feature
# `lattice`). Re-exported as `predicate_credential_system::jali`. Pinned to one release:
# `lattice::JALI_VERSION` repeats it and enters the digest of the lattice `pp` (a unit test keeps
# the two equal). 0.3.0 proves and verifies faster and keeps the proofs and transcripts of
# 0.2.0, but as the version enters the digest of `pp`, the lattice proofs of this crate change
# with it. 0.2.0 runs every proof on the duplex-sponge transcript of
# draft-irtf-cfrg-fiat-shamir-04 with fixed-width proof fields, so its proofs are not those of
# 0.1.x. 0.1.1 added the straight-line extractable mode of feature `lattice-extractable`.
jali          = { version = "=0.3.0", optional = true }
# Optional (feature `lattice`): NTRU trapdoors (TrapGen, SampPre at arbitrary targets, exact
# arithmetic in R_q for q = 5 mod 8) for the credential base Σ-vSIS
# (https://crates.io/crates/ntru-trapdoor). Pinned to one release, as Jali is.
ntru-trapdoor = { version = "=0.1.1", optional = true }
# SHAKE128, RustCrypto's `shake`: the duplex sponge of the Fiat–Shamir transform of the sigma
# protocols (draft-irtf-cfrg-fiat-shamir-04, suite SHAKE128, module `hash::duplex_sponge`), and
# with the feature `lattice` the random oracles of the lattice instantiation (H_mat, the
# expansion of pp). Already in Cargo.lock as a dependency of Jali (same version, no new crate):
# Jali exposes only a fixed-format SHAKE128 stream (`rand::ShakePrg`) and ntru-trapdoor only a
# `hazmat` SHAKE256 without a stability promise.
shake         = "0.1"
# Optional (feature `parallel`): rayon, for the attestation verifications of a credential request
# (`pcreds::Protocol::evaluate_request`), which then run in parallel. Already in Cargo.lock through
# arkworks and Jali (same version, no new crate); it has no default features.
rayon         = { version = "1", optional = true, default-features = false }

[dev-dependencies]
# The crate itself with its test helpers switched on, so that `cargo test` compiles unit AND
# integration tests against `hash::testing` without anyone having to pass `--features test-utils`.
predicate-credential-system = { path = ".", features = ["test-utils", "serde", "jali", "lattice"] }
# Second pairing engine: shows that the library code is generic over `E: Pairing`.
ark-bn254 = "0.6.0"
# MUST stay 0.8: `ark_std::rand` re-exports rand 0.8, newer RNGs do not satisfy its traits.
rand      = { version = "0.8", features = ["std", "std_rng"] }
criterion = "0.8"
serde_json = "1"
# TEST ONLY: the BBS crate of the Affinidi / OpenVTC stack (IETF BBS on `bls12_381_plus`), pinned,
# for the interoperability tests of `pcreds::pairing::ietf` (tests/bbs_ietf_interop.rs).
affinidi-bbs = "=0.3.3"
# Thread pools of a chosen width for tests/lattice_parallel.rs (the attestation verifications run
# in batches of the pool's width). Already in Cargo.lock (criterion, arkworks, Jali).
rayon     = "1"

# Benchmarks (criterion). Each one first prints the sizes of the objects it handles.
# `pcreds`: every party's algorithms of the protocol at k = 5 for every pairing-based base/tag
# pair; `kiprf`: the tags Tag_DDH and Tag_DY; `lattice`: the lattice instantiation (Σ-vSIS,
# Tag_LWR and the protocol at the lattice backend at k = 1, 3, 5).
[[bench]]
name = "pcreds"
harness = false

[[bench]]
name = "kiprf"
harness = false

[[bench]]
name = "lattice"
harness = false
required-features = ["lattice"]

# A cost probe of the lattice instantiation by retired instructions (docs/testing-and-benchmarks.md,
# "The extractable build").
[[example]]
name = "lattice_costs"
required-features = ["lattice"]

[features]
default     = []
# rayon-based parallelism inside arkworks (MSM, batch normalisation, batch checks), inside Jali's
# prover and verifier when Jali is enabled (its outputs do not depend on the thread count), and
# across the attestation verifications of a credential request (`Protocol::evaluate_request`):
# the same verdicts, in batches no wider than the rayon pool (a lattice attestation holds up to
# about 0.7 GB while it is verified).
parallel    = ["ark-ec/parallel", "ark-ff/parallel", "ark-std/parallel", "ark-serialize/parallel", "jali?/parallel", "dep:rayon"]
# x86_64 (bmi2 + adx) assembly backend of ark-ff; a no-op on other targets.
asm         = ["ark-ff/asm"]
# Nested wall-clock timings from `ark_std::{start_timer, end_timer}`.
print-trace = ["ark-std/print-trace"]
# TEST HELPERS ONLY, never enable in a deployment: exposes the INSECURE hash-to-group oracle
# `hash::testing` (known discrete logarithms) to integration tests, benches and downstream test
# suites.
test-utils  = []
# `serde::{Serialize, Deserialize}` for the protocol objects: see the module `serialization`.
serde       = ["dep:serde", "dep:multibase"]
# The lattice zero-knowledge library Jali (github.com/etairi/jali), re-exported as `jali`.
jali        = ["dep:jali"]
# The post-quantum (lattice) instantiation: the backend `pcreds::lattice::LatticeBackend` with the
# credential base Σ-vSIS (`pcreds::lattice::base`), the tag `kiprf::LWR` (short-key Tag_LWR) and
# the module `lattice`. Jali's `serde` loads the embedded parameter sets (`TboxParams::from_json`)
# and exports the statements to Jali's parameter tool (`tools/lattice/sets/`). Its proofs are
# straight-line extractable: the lattice backend proves with Jali's extractable mode (Katsumata's
# transform, classical random-oracle model) instead of plain Fiat–Shamir, so that an extractor
# holding a trapdoor of a key that the random oracle outputs recovers the witness from a single
# proof, without rewinding. The pairing instantiation keeps plain Fiat–Shamir.
lattice     = ["jali", "jali/serde", "dep:ntru-trapdoor"]
# The lattice instantiation with plain Fiat–Shamir proofs instead of the straight-line extractable
# ones, extracted by rewinding only. The proofs are 5.6 to 7.1 times shorter (`lattice::sets`).
# The mode changes the lattice proofs, their bounds and the digest of the lattice `pp`, so every
# party of a deployment builds with the same choice: the two builds refuse each other's parameters
# and proofs. `lattice-extractable` overrides it.
lattice-plain = ["lattice"]
# The straight-line extractable proofs, which `lattice` proves by default since the plain mode
# moved to `lattice-plain`, kept so that the commands of earlier versions build the same mode. It
# overrides `lattice-plain`, so a build with every feature proves in the extractable mode.
lattice-extractable = ["lattice"]

# Optimise test builds: the tests are dominated by pairings and scalar multiplications.
[profile.test]
opt-level = 3
